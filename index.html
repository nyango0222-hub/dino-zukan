<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きょうりゅう ずかん</title>
<style>
:root{
  --green:#2D6A4F; --leaf:#74C69D; --bg:#E9F7EC;
  --orange:#FF8552; --yellow:#FFD166; --sky:#BDE8F5;
  --ink:#27403A; --card:#FFFFFF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic UI',system-ui,sans-serif;
  background:linear-gradient(#CDEFFB 0%, var(--bg) 45%);
  color:var(--ink); min-height:100vh; font-weight:700;
}
header{
  text-align:center; padding:14px 10px 6px;
}
h1{
  margin:0; font-size:clamp(26px,7vw,40px); letter-spacing:2px; color:var(--green);
  text-shadow:2px 2px 0 #fff;
}
h1 .egg{display:inline-block; animation:wobble 3s infinite;}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.tabs{
  display:flex; gap:10px; justify-content:center; padding:10px; position:sticky; top:0; z-index:5;
}
.tab{
  border:0; border-radius:999px; padding:12px 26px; font-size:20px; font-weight:800;
  font-family:inherit; cursor:pointer; background:#fff; color:var(--green);
  box-shadow:0 4px 0 rgba(45,106,79,.25);
}
.tab.on{background:var(--green); color:#fff; box-shadow:0 4px 0 #1B4332;}
.tab:active{transform:translateY(3px); box-shadow:none;}
main{max-width:900px; margin:0 auto; padding:8px 12px 90px;}
/* ---- ずかん ---- */
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;
}
.dcard{
  background:var(--card); border-radius:20px; padding:8px 6px 10px; text-align:center;
  border:3px solid var(--leaf); cursor:pointer; position:relative;
  transition:transform .1s;
}
.dcard:active{transform:scale(.95);}
.dcard svg{width:100%; height:96px;}
.dname{font-size:15px; font-weight:800; line-height:1.2;}
.badge{
  position:absolute; top:6px; right:8px; font-size:18px;
}
.foodtag{
  position:absolute; top:6px; left:8px; font-size:16px;
}
/* ---- 詳細モーダル ---- */
.overlay{
  position:fixed; inset:0; background:rgba(39,64,58,.55); display:none;
  align-items:center; justify-content:center; z-index:20; padding:14px;
}
.overlay.show{display:flex;}
.detail{
  background:#fff; border-radius:26px; max-width:440px; width:100%;
  padding:16px; text-align:center; border:5px solid var(--yellow);
  max-height:92vh; overflow:auto;
}
.detail svg{width:78%; max-width:280px; height:auto;}
.detail .yomi{color:var(--orange); font-size:15px; margin:2px 0 0;}
.detail h2{margin:2px 0 6px; font-size:26px; color:var(--green);}
.facts{
  display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:8px 0;
}
.fact{
  background:var(--bg); border-radius:14px; padding:6px 12px; font-size:15px;
}
.hitokoto{
  background:#FFF4D9; border-radius:14px; padding:10px; font-size:16px; line-height:1.5;
}
.btnrow{display:flex; gap:10px; justify-content:center; margin-top:12px;}
.bigbtn{
  border:0; border-radius:999px; padding:12px 22px; font-size:19px; font-weight:800;
  font-family:inherit; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.2);
}
.bigbtn:active{transform:translateY(3px); box-shadow:none;}
.speak{background:var(--orange); color:#fff;}
.close{background:#E0E0E0; color:var(--ink);}
/* ---- クイズ ---- */
.quizbox{
  background:#fff; border-radius:26px; border:4px solid var(--leaf);
  padding:16px; text-align:center; max-width:520px; margin:0 auto;
}
.quizbox svg{width:70%; max-width:260px; height:auto;}
.qtext{font-size:21px; margin:4px 0 10px;}
.choices{display:grid; gap:10px;}
.choice{
  border:0; border-radius:18px; padding:14px 10px; font-size:20px; font-weight:800;
  font-family:inherit; cursor:pointer; background:var(--sky); color:var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.15);
}
.choice:active{transform:translateY(3px); box-shadow:none;}
.choice.good{background:var(--yellow);}
.choice.bad{background:#FFB4A8;}
.result{font-size:30px; min-height:44px; margin-top:8px; font-weight:900;}
.scorebar{
  display:flex; justify-content:center; gap:18px; font-size:18px; margin-bottom:10px;
}
.scorebar span{background:#fff; border-radius:999px; padding:6px 16px; border:2px solid var(--leaf);}
.next{background:var(--green); color:#fff; margin-top:10px; display:none;}
.next.show{display:inline-block;}
/* ---- がんばりカード ---- */
.stampnote{
  text-align:center; font-size:17px; background:#fff; border-radius:16px;
  padding:10px; margin-bottom:12px; border:3px dashed var(--leaf);
}
/* お祝い */
.confetti{
  position:fixed; top:-20px; font-size:24px; z-index:50; pointer-events:none;
  animation:fall 1.6s linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.2;}}
.hills{
  position:fixed; bottom:0; left:0; right:0; height:70px; z-index:-1;
  background:radial-gradient(circle at 20% 120%, var(--leaf) 0 60px, transparent 61px),
             radial-gradient(circle at 55% 130%, var(--green) 0 80px, transparent 81px),
             radial-gradient(circle at 85% 120%, var(--leaf) 0 55px, transparent 56px);
}
img.photo{
  width:100%; height:96px; object-fit:contain; border-radius:12px; background:#fff;
}
.detail img.photo{width:88%; height:180px; max-width:340px;}
.quizbox img.photo{width:80%; height:190px; max-width:300px;}
.credit{
  text-align:center; font-size:13px; color:#5E7A6E; margin:0 0 4px; min-height:16px;
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important;}
}
</style>
</head>
<body>
<div class="hills"></div>
<header>
  <h1><span class="egg">🥚</span> きょうりゅう ずかん <span class="egg">🦖</span></h1>
</header>
<nav class="tabs">
  <button class="tab on" id="tabZukan" onclick="showZukan()">📖 ずかん</button>
  <button class="tab" id="tabQuiz" onclick="showQuiz()">❓ クイズ</button>
  <button class="tab" id="modeBtn" onclick="togglePhoto()">📷 しゃしん</button>
</nav>
<p class="credit" id="photoStatus"></p>
<main>
  <section id="zukan">
    <div class="stampnote">クイズに せいかいすると ⭐がつくよ！ <span id="starCount"></span></div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="quiz" style="display:none">
    <div class="scorebar">
      <span>⭕ せいかい <b id="okNum">0</b></span>
      <span>🔥 れんぞく <b id="streakNum">0</b></span>
    </div>
    <div class="quizbox">
      <div id="quizArt"></div>
      <p class="qtext">この きょうりゅうの なまえは？</p>
      <div class="choices" id="choices"></div>
      <div class="result" id="result"></div>
      <button class="bigbtn next" id="nextBtn" onclick="newQuiz()">つぎの もんだい ▶</button>
    </div>
  </section>
</main>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail" id="detailBox"></div>
</div>

/* ================= 状態 ================= */
const stars=new Set();   // クイズ正解した恐竜（メモリ内のみ）
let okCount=0, streak=0, current=null, locked=false;

const FOODICON={"にく":"🍖","くさ":"🌿","さかな":"🐟"};

/* ================= ずかん ================= */
function renderGrid(){
  const g=document.getElementById('grid');
  g.innerHTML=DINOS.map((d,i)=>`
    <div class="dcard" onclick="openDetail(${i})">
      <span class="foodtag">${FOODICON[d.food]}</span>
      <span class="badge">${stars.has(d.n)?"⭐":""}</span>
      ${artHTML(d)}
      <div class="dname">${d.n}</div>
    </div>`).join("");
  document.getElementById('starCount').textContent=`（いま ${stars.size}／${DINOS.length}こ）`;
}
function openDetail(i){
  const d=DINOS[i];
  document.getElementById('detailBox').innerHTML=`
    ${artHTML(d)}
    <h2>${d.n} ${stars.has(d.n)?"⭐":""}</h2>
    <p class="yomi">（${d.y}）</p>
    <div class="facts">
      <span class="fact">${FOODICON[d.food]} ${d.food}を たべる</span>
      <span class="fact">📏 ながさ ${d.len}</span>
      <span class="fact">🕰️ ${d.era}</span>
    </div>
    <div class="hitokoto">💡 ${d.f}</div>
    <div class="btnrow">
      <button class="bigbtn speak" onclick="say('${d.n}')">🔊 なまえを きく</button>
      <button class="bigbtn close" onclick="closeDetail()">とじる</button>
    </div>`;
  document.getElementById('overlay').classList.add('show');
  say(d.n);
}
function closeDetail(){document.getElementById('overlay').classList.remove('show');}

/* ================= よみあげ ================= */
function say(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP"; u.rate=0.85; u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= クイズ ================= */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newQuiz(){
  locked=false;
  current=DINOS[Math.floor(Math.random()*DINOS.length)];
  const others=shuffle(DINOS.filter(d=>d.n!==current.n)).slice(0,2);
  const opts=shuffle([current,...others]);
  document.getElementById('quizArt').innerHTML=artHTML(current);
  document.getElementById('choices').innerHTML=opts.map(o=>
    `<button class="choice" onclick="answer(this,'${o.n}')">${o.n}</button>`).join("");
  document.getElementById('result').textContent="";
  document.getElementById('nextBtn').classList.remove('show');
}
function answer(btn,name){
  if(locked)return; locked=true;
  const good=name===current.n;
  document.querySelectorAll('.choice').forEach(b=>{
    if(b.textContent===current.n)b.classList.add('good');
    else if(b===btn)b.classList.add('bad');
  });
  const r=document.getElementById('result');
  if(good){
    okCount++; streak++; stars.add(current.n);
    r.textContent="⭕ せいかい！すごい！"; r.style.color="#E0703A";
    say("せいかい！"+current.n);
    confetti();
  }else{
    streak=0;
    r.textContent=`こたえは「${current.n}」だよ`; r.style.color="#4E7A99";
    say("ざんねん。こたえは、"+current.n);
  }
  document.getElementById('okNum').textContent=okCount;
  document.getElementById('streakNum').textContent=streak;
  document.getElementById('nextBtn').classList.add('show');
}
function confetti(){
  const em=["🎉","⭐","🦖","🦕","✨"];
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    s.className="confetti";
    s.textContent=em[Math.floor(Math.random()*em.length)];
    s.style.left=Math.random()*100+"vw";
    s.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),2200);
  }
}

/* ================= しゃしんモード（Wikipediaから取得） ================= */
let photoMode=false, photoLoaded=false;
const photoURL={};
/* 記事名が恐竜名と異なる場合の対応表 */
const WIKI={"フタバサウルス":"フタバスズキリュウ","アーケオプテリクス":"始祖鳥","ミンミ":"ミンミ (恐竜)"};

async function fetchPhoto(d){
  if(photoURL[d.n]!==undefined) return;
  try{
    const t=WIKI[d.n]||d.n;
    const r=await fetch("https://ja.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t));
    if(!r.ok) throw 0;
    const j=await r.json();
    let src=(j.thumbnail&&j.thumbnail.source)||null;
    /* 元画像が640px以上ある場合のみ640pxに拡大（小さい画像を拡大要求するとエラーになるため） */
    if(src&&j.originalimage&&j.originalimage.width>=640){
      src=src.replace(/\/(\d+)px-/, "/640px-");
    }
    photoURL[d.n]=src;
  }catch(e){ photoURL[d.n]=null; }
}

function artHTML(d){
  if(photoMode&&photoURL[d.n]){
    return `<img class="photo" src="${photoURL[d.n]}" alt="${d.n}" loading="lazy" onerror="this.onerror=null;this.outerHTML=DINO_FALLBACK['${d.n}']">`;
  }
  return dinoSVG(d);
}
const DINO_FALLBACK={};
DINOS.forEach(d=>DINO_FALLBACK[d.n]=dinoSVG(d));

async function togglePhoto(){
  const st=document.getElementById('photoStatus');
  const btn=document.getElementById('modeBtn');
  if(!photoMode){
    if(!photoLoaded){
      st.textContent="しゃしんを よみこみちゅう…📡";
      btn.disabled=true;
      await Promise.allSettled(DINOS.map(fetchPhoto));
      photoLoaded=true;
      btn.disabled=false;
    }
    photoMode=true;
    const found=DINOS.filter(d=>photoURL[d.n]).length;
    st.textContent=`しゃしん：Wikipedia（ウィキペディア）より・${found}／${DINOS.length}しゅるい`;
    btn.textContent="🎨 イラスト";
  }else{
    photoMode=false;
    st.textContent="";
    btn.textContent="📷 しゃしん";
  }
  renderGrid();
  if(document.getElementById('quiz').style.display!=="none"&&current&&!locked){
    document.getElementById('quizArt').innerHTML=artHTML(current);
  }
}

/* ================= タブ ================= */
function showZukan(){
  document.getElementById('zukan').style.display="";
  document.getElementById('quiz').style.display="none";
  document.getElementById('tabZukan').classList.add('on');
  document.getElementById('tabQuiz').classList.remove('on');
  renderGrid();
}
function showQuiz(){
  document.getElementById('zukan').style.display="none";
  document.getElementById('quiz').style.display="";
  document.getElementById('tabQuiz').classList.add('on');
  document.getElementById('tabZukan').classList.remove('on');
  newQuiz();
}

renderGrid();
